services:
  - type: web
    name: framekeeper-site
    runtime: static
    staticPublishPath: streamer-site
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: challenge-deck
    runtime: node
    rootDir: obs-build
    buildCommand: npm install
    startCommand: npm start
    plan: free
