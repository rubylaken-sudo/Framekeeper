<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge Deck — Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{ --accent:#5ff771; }
  html,body{height:100%}
  body{
    background:oklch(0.15 0.012 265);
    color:oklch(0.96 0.005 265);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  @keyframes cd-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid oklch(0.28 0.013 265 / 0.7)}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#0a160c;box-shadow:0 4px 16px color-mix(in oklab,var(--accent) 40%,transparent)}
  .brand h1{font-size:17px;letter-spacing:.3px;font-weight:700}
  .brand .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(0.66 0.015 265);letter-spacing:1px}
  .controls{display:flex;align-items:center;gap:14px}
  .pill{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1px;border:1px solid oklch(0.3 0.013 265);background:oklch(0.22 0.014 265);color:oklch(0.62 0.015 265)}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:oklch(0.45 0.014 265)}
  .pill.on{background:oklch(0.64 0.21 25 / 0.12);border-color:oklch(0.64 0.21 25 / 0.4);color:oklch(0.78 0.16 25)}
  .pill.on .dot{background:oklch(0.64 0.21 25);animation:cd-pulse 1.4s ease-in-out infinite}
  .count{font-family:'JetBrains Mono',monospace;font-size:13px;color:oklch(0.7 0.015 265)}
  .count b{color:oklch(0.96 0.005 265);font-weight:600}
  .conn{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;padding:5px 10px;border-radius:7px;border:1px solid oklch(0.3 0.013 265)}
  .conn.ok{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 45%,transparent)}
  .conn.bad{color:oklch(0.7 0.18 60);border-color:oklch(0.7 0.18 60 / 0.45)}
  .clear{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;color:oklch(0.72 0.015 265);background:oklch(0.24 0.014 265);border:1px solid oklch(0.32 0.014 265);padding:8px 14px;border-radius:9px;cursor:pointer}
  .clear:hover{background:oklch(0.28 0.015 265)}
  main{padding:24px 28px;max-width:640px}
  .label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;color:oklch(0.6 0.015 265);margin-bottom:14px}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:13px;cursor:pointer;background:oklch(0.215 0.014 265);border:1px solid oklch(0.3 0.013 265);transition:background .15s,border-color .15s}
  .card:hover{background:oklch(0.235 0.015 265)}
  .card.active{background:color-mix(in oklab,var(--accent) 13%,oklch(0.22 0.014 265));border-color:var(--accent)}
  .bar{width:4px;height:40px;border-radius:4px;flex:none;background:oklch(0.34 0.012 265);transition:background .15s}
  .card.active .bar{background:var(--accent)}
  .body{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .row{display:flex;align-items:center;gap:8px}
  .tag{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:1.5px;padding:2px 6px;border-radius:5px;background:oklch(0.34 0.012 265);color:oklch(0.74 0.015 265);flex:none}
  .title{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .desc{font-size:12.5px;color:oklch(0.66 0.015 265);line-height:1.35}
  .btn{font-size:12.5px;font-weight:500;padding:7px 14px;border-radius:8px;background:transparent;color:oklch(0.74 0.015 265);border:1px solid oklch(0.36 0.013 265);flex:none}
  .card.active .btn{background:var(--accent);color:#0a160c;border-color:var(--accent);font-weight:600;letter-spacing:.3px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="mark">C</div>
      <div>
        <h1>CHALLENGE DECK</h1>
        <div class="sub">FORTNITE · STREAM CONTROLS</div>
      </div>
    </div>
    <div class="controls">
      <div id="live" class="pill"><span class="dot"></span><span id="liveLabel">IDLE</span></div>
      <div class="count"><b id="activeCount">0</b> / <span id="totalCount">0</span> active</div>
      <div id="conn" class="conn bad">CONNECTING…</div>
      <button class="clear" id="clearBtn">Clear all</button>
    </div>
  </div>
  <main>
    <div class="label">CONTROL PANEL · TAP A CARD TO GO LIVE</div>
    <div class="list" id="list"></div>
  </main>

<script>
  const listEl = document.getElementById('list');
  const connEl = document.getElementById('conn');
  let challenges = [];
  let ws;



  function render() {
    const active = challenges.filter(c => c.active).length;
    document.getElementById('activeCount').textContent = active;
    document.getElementById('totalCount').textContent = challenges.length;
    const live = document.getElementById('live');
    live.classList.toggle('on', active > 0);
    document.getElementById('liveLabel').textContent = active > 0 ? 'LIVE' : 'IDLE';

    listEl.innerHTML = '';
    for (const c of challenges) {
      const card = document.createElement('div');
      card.className = 'card' + (c.active ? ' active' : '');
      card.innerHTML =
        '<div class="bar"></div>' +
        '<div class="body"><div class="row"><span class="tag"></span><span class="title"></span></div>' +
        '<span class="desc"></span></div>';
      card.querySelector('.tag').textContent = c.tag;
      card.querySelector('.title').textContent = c.title;
      card.querySelector('.desc').textContent = c.sub;
      const btn = document.createElement('div');
      btn.className = 'btn';
      btn.textContent = c.active ? 'On Air' : 'Activate';
      card.appendChild(btn);
      card.addEventListener('click', () => send({ type: 'toggle', id: c.id }));
      listEl.appendChild(card);
    }
  }

  function send(msg) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  }

  document.getElementById('clearBtn').addEventListener('click', () => send({ type: 'clear' }));

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host);
    ws.onopen = () => { connEl.textContent = 'CONNECTED'; connEl.className = 'conn ok'; };
    ws.onclose = () => { connEl.textContent = 'RECONNECTING…'; connEl.className = 'conn bad'; setTimeout(connect, 1000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') { challenges = msg.challenges; render(); }
    };
  }
  connect();
</script>
</body>
</html>
